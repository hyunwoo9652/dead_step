<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEAD STEP · 데드 스텝</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, "Noto Sans CJK KR", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #101722; color: #e6edf7; }
    .shell { max-width: 1040px; margin: 0 auto; padding: 22px; }
    h1 { font-size: 30px; margin: 0; letter-spacing: 2px; }
    .subtitle { color: #a2b2c8; margin: 4px 0 20px; }
    .layout { display: flex; gap: 20px; align-items: flex-start; }
    .board-wrap { overflow: auto; max-width: 100%; background: #151f2d; padding: 10px; border-radius: 10px; }
    #board { display: grid; grid-template-columns: repeat(15, 37px); gap: 2px; width: max-content; }
    .cell { position: relative; width: 37px; height: 37px; border: 1px solid #304055; background: #182232; color: #e6edf7; cursor: default; border-radius: 3px; user-select: none; }
    .cell.visited { background: #243246; }
    .cell.wall { background: #526074; }
    .cell.allowed { background: #253d55; cursor: pointer; }
    .cell.selected { background: #356b80; }
    .cell.source { background: #6d2b3d; }
    .hint { position: absolute; top: 1px; left: 4px; font-size: 12px; font-weight: bold; }
    .scan { position: absolute; bottom: 1px; right: 2px; color: #7fcfff; font-size: 11px; font-weight: bold; }
    .flag { position: absolute; left: 10px; top: 5px; color: #f3c76d; font-size: 22px; }
    .token { position: absolute; inset: 7px; border-radius: 50%; display: grid; place-items: center; color: #101722; font-size: 14px; font-weight: bold; }
    .token.player { background: #f8d578; }
    .token.enemy { background: #ff7287; }
    .token.exit { background: #71e4b7; }
    .source-mark { position: absolute; left: 12px; top: 4px; color: #ffa1b0; font-size: 20px; }
    aside { flex: 1; min-width: 270px; background: #192435; padding: 18px; border-radius: 10px; }
    aside h2 { margin: 0 0 12px; }
    #stats { white-space: pre-line; line-height: 1.75; }
    label { display: block; margin: 18px 0 8px; color: #a2b2c8; }
    select, button { font: inherit; color: #e6edf7; background: #2a3c55; border: 0; border-radius: 6px; padding: 10px 12px; }
    select { width: 100%; }
    button { width: 100%; display: block; margin-top: 8px; cursor: pointer; text-align: left; }
    button:hover, button:focus-visible, select:focus-visible { background: #39577a; outline: 2px solid #7fcfff; }
    button:disabled { opacity: .55; cursor: default; }
    .legend { margin-top: 20px; color: #a2b2c8; font-size: 13px; line-height: 1.65; }
    #record { margin-top: 15px; color: #77dcc4; }
    #message { margin-top: 14px; min-height: 28px; font-size: 15px; }
    #error { color: #ffa1b0; min-height: 20px; }
    @media (max-width: 850px) { .layout { flex-direction: column; } aside { width: 100%; } }
  </style>
</head>
<body>
  <main class="shell">
    <h1>DEAD STEP</h1>
    <p class="subtitle">정보를 모으고, 추격을 피해 탈출하세요.</p>
    <div class="layout">
      <div class="board-wrap"><div id="board" role="grid" aria-label="15×15 게임 맵"></div></div>
      <aside>
        <h2>탈출 작전</h2>
        <div id="stats"></div>
        <label for="difficulty">난이도</label>
        <select id="difficulty">
          <option value="easy">쉬움 · 감염원 5개</option>
          <option value="normal">보통 · 감염원 8개</option>
          <option value="hard">어려움 · 감염원 10개</option>
        </select>
        <button id="new" type="button">새 게임 [R]</button>
        <button id="retry" type="button">같은 맵 다시 도전</button>
        <button id="scan-button" type="button">탐색 시작 / 취소 [S]</button>
        <button id="help" type="button">게임 방법</button>
        <div class="legend">P 플레이어　E 출구　Z 감염체　■ 벽<br>
          방향키: 이동 / 우클릭: 위험 예상 칸 ! 표시<br>
          흰 숫자: 주변 8칸의 감염원 수<br>
          파란 s숫자: 선택 칸을 포함한 3×3 감염원 수<br>
          탐색 중 서로 다른 두 칸을 선택하면 한 턴이 진행됩니다. S 또는 Esc로 취소할 수 있습니다.</div>
        <div id="record"></div>
      </aside>
    </div>
    <div id="message" role="status" aria-live="polite"></div>
    <div id="error" role="alert"></div>
  </main>
  <script>
    'use strict';
    let state = null;
    let scanMode = false;
    let selected = [];
    let busy = false;
    const $ = id => document.getElementById(id);
    const key = p => p.join(',');
    const setOf = items => new Set(items.map(key));
    const countMap = items => new Map(items.map(([r, c, count]) => [`${r},${c}`, count]));
    const same = (a, b) => a && b && a[0] === b[0] && a[1] === b[1];

    async function request(action) {
      if (busy) return;
      busy = true;
      $('error').textContent = '';
      try {
        const response = await fetch('/api/action', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(action)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '요청을 처리하지 못했습니다.');
        state = result;
        render();
      } catch (error) {
        $('error').textContent = error.message;
      } finally {
        busy = false;
      }
    }

    function toggleScan() {
      if (!state || state.status !== 'playing') return;
      scanMode = !scanMode;
      selected = [];
      render();
    }

    function render() {
      if (!state) return;
      const g = state;
      const walls = setOf(g.walls), sources = setOf(g.sources);
      const visited = setOf(g.visited), flags = setOf(g.flags);
      const allowed = setOf(g.scan_allowed), hints = countMap(g.hints), scans = countMap(g.scans);
      const chosen = setOf(selected);
      const fragment = document.createDocumentFragment();
      for (let r = 0; r < g.size; r++) {
        for (let c = 0; c < g.size; c++) {
          const p = [r, c], k = key(p);
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.setAttribute('role', 'gridcell');
          cell.setAttribute('aria-label', `${r + 1}행 ${c + 1}열`);
          if (visited.has(k)) cell.classList.add('visited');
          if (walls.has(k)) cell.classList.add('wall');
          if (scanMode && allowed.has(k)) cell.classList.add('allowed');
          if (chosen.has(k)) cell.classList.add('selected');
          if (sources.has(k)) cell.classList.add('source');
          if (hints.has(k)) cell.innerHTML += `<span class="hint">${hints.get(k)}</span>`;
          if (scans.has(k)) cell.innerHTML += `<span class="scan">s${scans.get(k)}</span>`;
          if (flags.has(k)) cell.innerHTML += '<span class="flag">!</span>';
          if (sources.has(k)) cell.innerHTML += '<span class="source-mark">×</span>';
          for (const [pos, name, klass] of [[g.exit, 'E', 'exit'], [g.enemy, 'Z', 'enemy'], [g.player, 'P', 'player']]) {
            if (same(p, pos)) cell.innerHTML += `<span class="token ${klass}">${name}</span>`;
          }
          cell.addEventListener('click', () => {
            if (!scanMode || g.status !== 'playing') return;
            if (!allowed.has(k)) {
              $('error').textContent = '강조된 5×5 범위의 벽이 아닌 칸을 선택하세요.';
              return;
            }
            $('error').textContent = '';
            if (chosen.has(k)) selected = selected.filter(item => !same(item, p));
            else selected.push(p);
            if (selected.length === 2) {
              const points = selected;
              selected = [];
              scanMode = false;
              request({action: 'scan', points});
            } else render();
          });
          cell.addEventListener('contextmenu', event => {
            event.preventDefault();
            request({action: 'flag', point: p});
          });
          fragment.appendChild(cell);
        }
      }
      $('board').replaceChildren(fragment);
      const status = {playing: '진행 중', won: '탈출 성공', lost: '탈출 실패'}[g.status];
      $('stats').textContent = `상태  ${status}\n턴 수  ${g.turn}\n감염원  ${g.source_count}개\n다음 감염체 행동  ${g.next_enemy_mode}\n맵 번호  ${g.seed}`;
      $('difficulty').value = g.difficulty;
      $('scan-button').textContent = scanMode ? `탐색 취소 [S] · ${selected.length}/2` : '탐색 시작 / 취소 [S]';
      $('scan-button').disabled = g.status !== 'playing';
      $('record').textContent = '현재 난이도 최고 기록\n' + (g.record === null ? '아직 탈출 기록이 없습니다.' : `${g.record}턴 탈출`);
      $('record').style.whiteSpace = 'pre-line';
      $('message').textContent = g.message + (g.status === 'playing' ? '' : '  R: 새 게임 / 같은 맵 다시 도전');
    }

    $('new').addEventListener('click', () => { scanMode = false; selected = []; request({action: 'new', difficulty: $('difficulty').value}); });
    $('retry').addEventListener('click', () => { scanMode = false; selected = []; request({action: 'retry'}); });
    $('difficulty').addEventListener('change', () => { scanMode = false; selected = []; request({action: 'new', difficulty: $('difficulty').value}); });
    $('scan-button').addEventListener('click', toggleScan);
    $('help').addEventListener('click', () => alert(
      '목표: 감염원과 감염체를 피해 E 출구에 도착하세요.\n\n' +
      '방향키: 상하좌우 한 칸 이동. 벽과 맵 밖 이동은 턴을 소비하지 않습니다.\n' +
      'S: 탐색 모드. 현재 위치 중심 5×5 범위의 서로 다른 두 칸을 클릭합니다.\n' +
      '두 칸을 확정하면 플레이어는 제자리에 있고 감염체가 한 번 이동합니다.\n' +
      '흰 숫자: 주변 8칸의 감염원 수. 파란 s숫자: 선택 칸을 포함한 3×3 감염원 수.\n' +
      '우클릭 ! 표시는 메모이며 게임 판정에 영향을 주지 않습니다.\n' +
      '감염체는 BFS 추격과 랜덤 이동을 한 턴씩 반복합니다.\n' +
      'R: 새 맵 / 같은 맵 다시 도전: 동일 배치.'));

    document.addEventListener('keydown', event => {
      if (!state || event.target === $('difficulty')) return;
      const k = event.key.toLowerCase();
      if (k === 'r') { event.preventDefault(); scanMode = false; selected = []; request({action: 'new', difficulty: $('difficulty').value}); return; }
      if (k === 's') { event.preventDefault(); toggleScan(); return; }
      if (k === 'escape' && scanMode) { event.preventDefault(); toggleScan(); return; }
      const directions = {arrowup: [-1, 0], arrowdown: [1, 0], arrowleft: [0, -1], arrowright: [0, 1], w: [-1, 0], a: [0, -1], d: [0, 1]};
      if (directions[k]) {
        event.preventDefault();
        if (!scanMode) request({action: 'move', direction: directions[k]});
      }
    });

    fetch('/api/state').then(response => response.json()).then(result => { state = result; render(); })
      .catch(error => { $('error').textContent = `게임을 불러오지 못했습니다: ${error.message}`; });
  </script>
</body>
</html>
